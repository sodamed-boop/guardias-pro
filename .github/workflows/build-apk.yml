name: Build APK (release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project (no Windows installs)
        run: |
          echo "== ROOT FILES =="
          ls -la

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml NO existe en la raiz del repo."
            echo "Solucion: subilo a la raiz (Branch v2)."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: carpeta lib/ NO existe en la raiz del repo."
            exit 1
          fi

          mkdir -p _build
          cd _build
          flutter create . --platforms=android --org com.mauro.guardiaspro --project-name guardias_pro

          rm -rf lib
          cp -r ../lib ./lib
          cp ../pubspec.yaml ./pubspec.yaml

          flutter pub get

      - name: Build APK Release
        run: |
          cd _build
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardiasPro-APK
          path: _build/build/app/outputs/flutter-apk/app-release.apk
