name: Build APK (release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project (no Windows installs)
        run: |
          echo "== ROOT FILES =="
          ls -la

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml NO existe en la raiz del repo."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "ERROR: carpeta lib/ NO existe en la raiz del repo."
            exit 1
          fi

          mkdir -p _build
          cd _build
          flutter create . --platforms=android --org com.mauro.guardiaspro --project-name guardias_pro

          rm -rf lib
          cp -r ../lib ./lib
          cp ../pubspec.yaml ./pubspec.yaml

                    echo "== Enable core library desugaring (fix flutter_local_notifications) =="

          python3 - <<'PY'
          from pathlib import Path

          gradle_groovy = Path("android/app/build.gradle")
          gradle_kts = Path("android/app/build.gradle.kts")

          if gradle_groovy.exists():
              p = gradle_groovy
              s = p.read_text(encoding="utf-8")

              if "desugar_jdk_libs" not in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
                  )

              if "coreLibraryDesugaringEnabled true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace(
                          "compileOptions {",
                          "compileOptions {\n        coreLibraryDesugaringEnabled true"
                      )
                  else:
                      s = s.replace(
                          "android {",
                          "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n        coreLibraryDesugaringEnabled true\n    }\n"
                      )

              p.write_text(s, encoding="utf-8")
              print("Patched Groovy gradle:", p)

          elif gradle_kts.exists():
              p = gradle_kts
              s = p.read_text(encoding="utf-8")

              if "desugar_jdk_libs" not in s:
                  s = s.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
                  )

              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  if "compileOptions {" in s:
                      s = s.replace(
                          "compileOptions {",
                          "compileOptions {\n        isCoreLibraryDesugaringEnabled = true"
                      )
                  else:
                      s = s.replace(
                          "android {",
                          "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8\n        isCoreLibraryDesugaringEnabled = true\n    }\n"
                      )

              p.write_text(s, encoding="utf-8")
              print("Patched Kotlin gradle:", p)

          else:
              raise FileNotFoundError("No existe ni android/app/build.gradle ni android/app/build.gradle.kts")
          PY
          flutter pub get

      - name: Build APK Release
        run: |
          cd _build
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardiasPro-APK
          path: _build/build/app/outputs/flutter-apk/app-release.apk
